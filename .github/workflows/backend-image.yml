name: Publish backend image

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .dockerignore
      - .github/workflows/backend-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tranvanha-tyranno/dsoft-audiotts-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Linux amd64 image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pull published image and verify runtime
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker run --rm --entrypoint python "$IMAGE@$DIGEST" -c "import os,pathlib,shutil; assert os.getuid()==10001; assert shutil.which('ffmpeg'); assert not pathlib.Path('/app/backend/data/demo_access.json').exists(); assert not pathlib.Path('/app/main').exists(); print('Published image verified')"
          echo "Image: \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: linux/amd64" >> "$GITHUB_STEP_SUMMARY"
